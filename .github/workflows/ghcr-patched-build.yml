# Build this fork's patched new-api and push it to GHCR.
#
# Why a separate workflow rather than docker-image-branch.yml: the upstream
# workflow hardcodes calciumion/new-api on Docker Hub and needs DOCKERHUB_*
# secrets we neither have nor should have. This one pushes to
# ghcr.io/<owner>/new-api using the built-in GITHUB_TOKEN, so it works on a
# fork with no secrets configured.
#
# amd64 + arm64: unraid (amd64) and the oracle arm64 pod both consume the
# combined image, which needs the base at both platforms.
name: Publish patched image (GHCR)

on:
  # Push trigger only: a dispatchable workflow must exist on the repository's
  # default branch, and this patch deliberately does not touch main.
  #
  # One branch per upstream release, named cachefix/<upstream tag>
  # (e.g. cachefix/v1.0.0-rc.40 -> image tag v1.0.0-rc.40-cachefix). The image
  # tag is derived from the branch, never hardcoded: the rc.35-cachefix image
  # was built from a branch that actually sat on rc.26.
  push:
    branches:
      - "cachefix/v*"

jobs:
  build:
    name: Build & push amd64+arm64 to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Enough history to reach the upstream tag below the patch commits.
          fetch-depth: 50

      - name: Resolve image tag
        id: imgtag
        run: |
          BASE="${GITHUB_REF_NAME#cachefix/}"
          TAG="${BASE}-cachefix"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing tag: ${TAG}"

      - name: Verify the branch sits on its upstream tag
        run: |
          # The fork carries no tags, so fetch the one the branch name claims
          # and refuse to publish if it is not an ancestor of what we build.
          BASE="${{ steps.imgtag.outputs.base }}"
          git fetch --no-tags --depth=1 https://github.com/QuantumNous/new-api.git "refs/tags/${BASE}:refs/tags/${BASE}"
          if ! git merge-base --is-ancestor "${BASE}" HEAD; then
            echo "::error::HEAD is not based on upstream ${BASE}"
            exit 1
          fi
          echo "Patch commits on top of ${BASE}:"
          git log --oneline "${BASE}..HEAD"

      - name: Write VERSION
        run: |
          # The Dockerfile reads VERSION and stamps it into common.Version, so
          # the running gateway reports what it actually is, patch marker included.
          echo "${{ steps.imgtag.outputs.value }}" > VERSION
          cat VERSION

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/new-api:${{ steps.imgtag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output digest
        run: |
          {
            echo "### Image"
            echo '```'
            echo "ghcr.io/${{ steps.owner.outputs.value }}/new-api:${{ steps.imgtag.outputs.value }}"
            echo "${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"